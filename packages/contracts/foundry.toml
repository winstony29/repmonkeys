[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 1000
depth = 15
fail_on_revert = false

[rpc_endpoints]
base_goerli = "https://sepolia.base.org"
base_mainnet = "https://mainnet.base.org"
base_sepolia = "https://sepolia.base.org"
# Alternative RPCs in case of issues:
# base_goerli = "https://base-goerli.public.blastapi.io"
# base_mainnet = "https://base.blockpi.network/v1/rpc/public"

[etherscan]
base_goerli = { key = "", url = "https://goerli.basescan.org" }
base_mainnet = { key = "", url = "https://basescan.org" }

