[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.19"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 1000
depth = 15
fail_on_revert = false

[rpc_endpoints]
base_goerli = "https://goerli.base.org"
base_mainnet = "https://mainnet.base.org"

[etherscan]
base_goerli = { key = "" }
base_mainnet = { key = "" }

[etherscan.base_goerli]
base_url = "https://goerli.basescan.org"

